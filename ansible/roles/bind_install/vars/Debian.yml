---
bind_install_packages:
  - bind9
  - bind9-utils
  - bind9-dnsutils
bind_install_service: named
bind_install_user: bind
bind_install_group: bind
bind_install_conf_dir: /etc/bind
bind_install_main_conf: /etc/bind/named.conf
bind_install_options_conf: /etc/bind/named.conf.options
bind_install_local_conf: /etc/bind/named.conf.local
bind_install_data_dir: /var/cache/bind
bind_install_zone_dir: /var/lib/bind
